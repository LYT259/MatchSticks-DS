name: Full validation (Windows)

# 三端验证的 Windows 一端（Mac 本机 / 实体 Linux SSH 主机 / GitHub Actions Windows；入口见
# scripts/validate-all.sh 与 scripts/test-core.sh）：在 GitHub 托管的 Windows 原生 Swift 工具链上
# 构建并运行 DSCoreTests（同一套断言，经 Winsock）。不是 WSL，不是 Linux 冒充 Windows。
#
# 触发：
#   - pull_request 目标 beta/stable —— 首次随 PR 即在 Windows 真跑。workflow_dispatch 只有在 workflow 文件
#     进入默认分支 stable 之后才可用，首个 PR 只能靠这个触发器；
#   - push 到 beta/stable；
#   - workflow_dispatch（scripts/validate-all.sh 在文件已进入 stable 后走这条）。
#   配额纪律：只有这一个 Windows job（AGENTS.md 红线 5，用户点名恢复用于 Windows 验证）。
# 本 workflow 只做验证：不合并、不发 Release、不自动重试；失败即红，由人工处理。
#
# 可复现性（2026-11-23 逐项核实）：
#   - Swift 安装包钉 swift.org 的 6.4.2 RELEASE 固定 URL（HTTP 200，2,098,337,696 字节；与 Mac 端 Xcode 自带
#     的 Apple Swift 6.4.2 同一版本线；swift.org 现已发布 6.4.3，升级属主动决策）；
#   - actions/checkout 钉 tag v4 对应的完整提交 SHA；
#   - runner 镜像钉 windows-2025（镜像 README：Visual Studio Enterprise 2022 17.14 + Windows SDK 10.0.26100.0 +
#     Git for Windows 2.56）。Swift 在 Windows 的前置组件（MSVC v143、Windows 11 SDK 或更新、Git）镜像自带。
# 覆盖范围：同 scripts/test-core.sh（协议/控制环/安全/日志/映射/迁移/双语/WebUI/SocketCompat）；
# 不含 macOS App/SwiftUI/Sparkle/打包版 E2E（只能在 Mac 上跑）。
#
# Windows 执行环境注意：
#   - `shell: cmd` 步骤里不能裸写 `bash`：镜像只在 C:\shells 放了 gitbash.exe / wslbash.exe 命名 shim，
#     裸 `bash` 按 PATH 会解析到 C:\Windows\System32\bash.exe（WSL 存根），MSVC 环境也带不进去；
#     这里显式调用 Git for Windows 的 bash.exe，继承 vcvarsall 设置的 INCLUDE/LIB/PATH。
#   - Swift 安装根目录不写死：安装器把 <root>\bin 写进 Machine/User PATH（当前进程不会刷新，从注册表读），
#     兜底 Program Files（提升权限安装）与 %LocalAppData%\Programs\Swift（swift.org 文档所述默认位置）。
#   - SDKROOT 只在真的找到 <root>\Platforms\...\Windows.platform\Developer\SDKs 时才设置。

on:
  push:
    branches: [beta, stable]
  pull_request:
    branches: [beta, stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-core:
    name: Windows · DSCoreTests
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Swift 6.4.2 (swift.org, pinned URL) and locate the toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.swift.org/swift-6.4.2-release/windows10/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE-windows10.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'swift-6.4.2-RELEASE-windows10.exe'
          & curl.exe -L --fail --silent --show-error -o $installer $url
          if ($LASTEXITCODE -ne 0) { throw "Swift installer download failed (curl exit $LASTEXITCODE)" }
          $size = (Get-Item $installer).Length
          Write-Host "installer bytes: $size"
          if ($size -lt 1500000000) { throw "Swift installer looks truncated ($size bytes; swift.org reports 2098337696)" }
          $process = Start-Process -FilePath $installer -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Swift installer exit code $($process.ExitCode)" }

          $roots = @()
          foreach ($scope in @('Machine', 'User')) {
            $pathValue = [Environment]::GetEnvironmentVariable('Path', $scope)
            if ($pathValue) {
              foreach ($dir in ($pathValue -split ';')) {
                $trimmed = $dir.Trim().Trim('"')
                if ($trimmed -and (Test-Path (Join-Path $trimmed 'swift.exe'))) { $roots += (Split-Path $trimmed -Parent) }
              }
            }
          }
          $roots += (Join-Path $env:ProgramFiles 'Swift')
          $roots += (Join-Path $env:LOCALAPPDATA 'Programs\Swift')
          $swiftRoot = $roots | Where-Object { $_ -and (Test-Path (Join-Path $_ 'bin\swift.exe')) } | Select-Object -First 1
          if (-not $swiftRoot) { throw "swift.exe not found after install (searched: $($roots -join '; '))" }
          $swiftExe = Join-Path $swiftRoot 'bin\swift.exe'
          $version = (& $swiftExe --version 2>&1 | Out-String)
          Write-Host "swift root: $swiftRoot"
          Write-Host $version
          if ($version -notmatch 'Swift version 6\.4\.2') { throw "Unexpected Swift version (expected 6.4.2): $version" }
          Add-Content -Path $env:GITHUB_ENV -Value "SWIFT_ROOT=$swiftRoot"

          $platforms = Join-Path $swiftRoot 'Platforms'
          $sdkRoots = @()
          if (Test-Path $platforms) {
            $sdkRoots = @(Get-ChildItem -Path $platforms -Directory -Recurse -Depth 2 -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq 'Windows.platform' -and (Test-Path (Join-Path $_.FullName 'Developer\SDKs')) } |
              ForEach-Object { $_.FullName })
          }
          if ($sdkRoots.Count -gt 0) {
            Add-Content -Path $env:GITHUB_ENV -Value "SDKROOT_VALUE=$($sdkRoots[0])"
            Write-Host "SDKROOT=$($sdkRoots[0])"
          } else {
            Write-Host "No Windows.platform with Developer\SDKs under $platforms; leaving SDKROOT unset (the compiler falls back to its own SDK lookup) — tree:"
            Get-ChildItem -Path $swiftRoot -Depth 2 -ErrorAction SilentlyContinue |
              Select-Object -First 80 -ExpandProperty FullName | ForEach-Object { Write-Host "  $_" }
          }

      - name: Build and run DSCoreTests (native Winsock, Git Bash)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 (echo vcvarsall.bat failed & exit 1)
          set "PATH=%SWIFT_ROOT%\bin;%PATH%"
          if defined SDKROOT_VALUE set "SDKROOT=%SDKROOT_VALUE%"
          if not exist "C:\Program Files\Git\bin\bash.exe" (echo Git Bash not found at C:\Program Files\Git\bin\bash.exe & exit 1)
          where swift >nul 2>&1
          if errorlevel 1 (echo swift.exe not found in PATH & exit 1)
          swift --version
          if errorlevel 1 exit 1
          echo SDKROOT=%SDKROOT%
          "C:\Program Files\Git\bin\bash.exe" scripts/test-core.sh

      - name: Coverage
        if: always()
        shell: bash
        run: |
          echo "Windows 覆盖：DSCore 协议/控制环/安全/日志/映射/迁移/双语/WebUI/SocketCompat（原生 Winsock）"
          echo "不覆盖：macOS App/SwiftUI/Sparkle/打包版 E2E —— 由 Mac 一键脚本 scripts/validate-all.sh 承担"
