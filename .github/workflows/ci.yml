name: CI
on:
  push:
    branches: [stable, beta, main, "feat/**", "fix/**", "docs/**"]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build (debug)
        run: swift build
      - name: Regression tests (277 checks incl. loopback, TCP & scenarios)
        run: swift run DSCoreTests
      - name: UI state dry tests (46 checks; no sockets or HID)
        run: bash scripts/test-ui.sh
      - name: Release universal build
        run: swift build -c release --arch arm64 --arch x86_64
